<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NAVETTE – Chauffeur</title>
  <meta name="theme-color" content="#0a5cad">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icone-180.png">
  <link rel="stylesheet" href="style.css?v=0.1.1">
</head>
<body>
  <header class="entete">
    <div class="entete-int">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7h12l5 4h2a1 1 0 0 1 1 1v4h-2"/><path d="M2 7v9h2"/><path d="M9 16h6"/><path d="M2 11h17"/><circle cx="6.5" cy="16.5" r="2"/><circle cx="17.5" cy="16.5" r="2"/></svg>
        NAVETTE
      </div>
      <span class="role">Chauffeur</span>
    </div>
  </header>

  <main class="contenu">
    <div id="bandeau" class="bandeau" role="alert" hidden></div>

    <form id="connexion" class="carte connexion" hidden>
      <h2>Accès chauffeur</h2>
      <label for="champ-pin">Code</label>
      <input type="password" id="champ-pin" inputmode="numeric" autocomplete="current-password" maxlength="8">
      <div class="erreur-champ" id="erreur-pin"></div>
      <button type="submit" class="btn btn-primaire btn-plein">Valider</button>
    </form>

    <div id="vue" hidden>
      <div id="demis" class="demis"></div>
      <p style="text-align:center;margin-top:24px">
        <button type="button" class="lien" id="deconnexion">Se déconnecter</button>
      </p>
    </div>
  </main>

  <footer class="pied" id="pied-version"></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js?v=0.1.1"></script>
  <script src="commun.js?v=0.1.1"></script>
  <script src="chauffeur.js?v=0.1.1"></script>
</body>
</html>
